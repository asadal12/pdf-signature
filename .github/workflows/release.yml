name: Build & release (Windows)

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable zip
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-signature-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PDF Signature ${{ steps.version.outputs.tag }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            dist/PDF-Signature-Setup-*.exe
            dist/PDF-Signature-*-win-x64-portable.zip
